name: regression-gate

# Standing regression gate for the radioctl / radio-inject stack.
# Re-runs the full Monte Carlo verification campaign on every push and PR.
# Assumes the project files live at the repository root; adjust paths if you
# nest them under a subdirectory.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux — python + bash campaign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: radio-inject acceptance selftest
        run: python3 radio-inject selftest

      - name: radio-inject Monte Carlo
        run: python3 montecarlo_radio_inject.py 20000 0xC0FFEE

      - name: radioctl.sh Monte Carlo
        run: bash montecarlo_radioctl.sh 150

      - name: shellcheck (informational — does not block the gate)
        continue-on-error: true
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -S error radioctl.sh montecarlo_radioctl.sh

  windows:
    name: windows — powershell campaign
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: radioctl.ps1 smoke (one-shot dispatch)
        shell: pwsh
        run: ./radioctl.ps1 doctor

      - name: radioctl.ps1 Monte Carlo
        shell: pwsh
        run: ./montecarlo_radioctl.ps1 -Runs 2000

  gate:
    name: regression gate
    needs: [ linux, windows ]
    runs-on: ubuntu-latest
    steps:
      - name: All campaigns passed
        run: echo "Monte Carlo regression gate green."
